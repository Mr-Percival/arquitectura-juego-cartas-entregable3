# Blueprint de Render: en el panel, New > Blueprint y elegir este repositorio.
# Crea el servicio web (desde el Dockerfile) y una base PostgreSQL 16, y los conecta con DATABASE_URL.
services:
  - type: web
    name: juego-cartas
    runtime: docker
    plan: free
    healthCheckPath: /salud
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: juego-cartas-db
          property: connectionString

databases:
  - name: juego-cartas-db
    plan: free
    postgresMajorVersion: "16"
